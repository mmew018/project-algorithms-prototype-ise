<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rfBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="rfShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="450" fill="url(#rfBg)" rx="16"/>
  <rect width="900" height="450" fill="none" stroke="#e2e8f0" stroke-width="2" rx="16"/>

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">
    สูตรและหลักการคำนวณ Multi-Criteria Weighted Ranking
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">
    ชั่งน้ำหนัก 4 ปัจจัยสำคัญพร้อมกัน ไม่ตัดสินจากราคาถูกอย่างเดียว
  </text>

  <!-- Formula Banner -->
  <rect x="40" y="80" width="820" height="48" rx="8" fill="#0f172a"/>
  <text x="450" y="110" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">
    FinalScore = (Relevance × 0.30) + (Budget × 0.25) + (Specs × 0.25) + (UseCase × 0.20)
  </text>

  <!-- 4 Pillars Breakdown Visual Row -->
  <g transform="translate(40, 145)">
    <!-- Pillar 1: Relevance -->
    <g transform="translate(0, 0)">
      <rect width="195" height="110" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#rfShadow)"/>
      <rect x="12" y="10" width="45" height="18" rx="4" fill="#2563eb"/>
      <text x="34" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">30%</text>
      <text x="65" y="24" fill="#1e40af" font-family="sans-serif" font-size="12" font-weight="bold">ตรงคำค้นหา</text>
      <text x="12" y="48" fill="#475569" font-family="sans-serif" font-size="10">• หมวดหมู่ตรง (+35)</text>
      <text x="12" y="65" fill="#475569" font-family="sans-serif" font-size="10">• แบรนด์ตรง (+15)</text>
      <text x="12" y="82" fill="#475569" font-family="sans-serif" font-size="10">• คำค้นใน Inverted Index</text>
      <text x="12" y="98" fill="#2563eb" font-family="sans-serif" font-size="9" font-weight="bold">Scale: 0 - 100 คะแนน</text>
    </g>

    <!-- Pillar 2: Budget -->
    <g transform="translate(208, 0)">
      <rect width="195" height="110" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#rfShadow)"/>
      <rect x="12" y="10" width="45" height="18" rx="4" fill="#059669"/>
      <text x="34" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">25%</text>
      <text x="65" y="24" fill="#065f46" font-family="sans-serif" font-size="12" font-weight="bold">ความคุ้มงบ</text>
      <text x="12" y="48" fill="#475569" font-family="sans-serif" font-size="10">• อยู่ในงบ: ได้ 92 - 100</text>
      <text x="12" y="65" fill="#475569" font-family="sans-serif" font-size="10">• ใช้ประโยชน์จากงบคุ้มค่า</text>
      <text x="12" y="82" fill="#dc2626" font-family="sans-serif" font-size="10">• เกินงบ: หักตามความชัน</text>
      <text x="12" y="98" fill="#059669" font-family="sans-serif" font-size="9" font-weight="bold">Scale: 0 - 100 คะแนน</text>
    </g>

    <!-- Pillar 3: Specs -->
    <g transform="translate(416, 0)">
      <rect width="195" height="110" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#rfShadow)"/>
      <rect x="12" y="10" width="45" height="18" rx="4" fill="#0284c7"/>
      <text x="34" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">25%</text>
      <text x="65" y="24" fill="#0369a1" font-family="sans-serif" font-size="12" font-weight="bold">สเปกฮาร์ดแวร์</text>
      <text x="12" y="48" fill="#475569" font-family="sans-serif" font-size="10">• ได้การ์ดจอ RTX 4060 = 100</text>
      <text x="12" y="65" fill="#475569" font-family="sans-serif" font-size="10">• ได้รุ่นต่ำกว่า 4050 = 65</text>
      <text x="12" y="82" fill="#475569" font-family="sans-serif" font-size="10">• ตรวจ RAM, SSD, จอ, Hz</text>
      <text x="12" y="98" fill="#0284c7" font-family="sans-serif" font-size="9" font-weight="bold">Scale: 0 - 100 คะแนน</text>
    </g>

    <!-- Pillar 4: Use Case -->
    <g transform="translate(625, 0)">
      <rect width="195" height="110" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#rfShadow)"/>
      <rect x="12" y="10" width="45" height="18" rx="4" fill="#d97706"/>
      <text x="34" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">20%</text>
      <text x="65" y="24" fill="#92400e" font-family="sans-serif" font-size="12" font-weight="bold">เหมาะกับงาน</text>
      <text x="12" y="48" fill="#475569" font-family="sans-serif" font-size="10">• Gaming: ดู GPU วัตต์เต็ม</text>
      <text x="12" y="65" fill="#475569" font-family="sans-serif" font-size="10">• Coding: ดู CPU Multi-core</text>
      <text x="12" y="82" fill="#475569" font-family="sans-serif" font-size="10">• พกพา: ดูน้ำหนัก &lt; 1.3kg</text>
      <text x="12" y="98" fill="#d97706" font-family="sans-serif" font-size="9" font-weight="bold">Scale: 0 - 100 คะแนน</text>
    </g>
  </g>

  <!-- Real Calculation Comparison Table -->
  <g transform="translate(40, 275)">
    <rect width="820" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#rfShadow)"/>
    
    <!-- Table Header -->
    <rect width="820" height="32" rx="8" fill="#f1f5f9"/>
    <text x="25" y="21" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">รุ่นสินค้า (Gaming Laptop งบ 40,000)</text>
    <text x="280" y="21" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">ราคา</text>
    <text x="365" y="21" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">คำค้น (30%)</text>
    <text x="460" y="21" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">งบ (25%)</text>
    <text x="545" y="21" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">สเปก (25%)</text>
    <text x="635" y="21" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">งาน (20%)</text>
    <text x="735" y="21" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">คะแนนสุทธิ</text>

    <!-- Row 1: Best Match -->
    <rect y="32" width="820" height="36" fill="#ecfdf5"/>
    <text x="25" y="55" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="bold">🏆 1. Lenovo LOQ 15 (RTX 4060 105W)</text>
    <text x="280" y="55" fill="#0f172a" font-family="monospace" font-size="11">฿37,900</text>
    <text x="390" y="55" fill="#0f172a" font-family="monospace" font-size="11">100</text>
    <text x="480" y="55" fill="#059669" font-family="monospace" font-size="11" font-weight="bold">100</text>
    <text x="565" y="55" fill="#0f172a" font-family="monospace" font-size="11">100</text>
    <text x="655" y="55" fill="#0f172a" font-family="monospace" font-size="11">92</text>
    <text x="745" y="55" fill="#059669" font-family="monospace" font-size="14" font-weight="bold">98 / 100</text>

    <!-- Row 2: In budget -->
    <text x="25" y="90" fill="#0f172a" font-family="sans-serif" font-size="11">   2. Acer Nitro V 15 (RTX 4060 75W)</text>
    <text x="280" y="90" fill="#0f172a" font-family="monospace" font-size="11">฿34,900</text>
    <text x="390" y="90" fill="#0f172a" font-family="monospace" font-size="11">100</text>
    <text x="480" y="90" fill="#059669" font-family="monospace" font-size="11">100</text>
    <text x="565" y="90" fill="#0f172a" font-family="monospace" font-size="11">100</text>
    <text x="655" y="90" fill="#0f172a" font-family="monospace" font-size="11">89</text>
    <text x="745" y="90" fill="#2563eb" font-family="monospace" font-size="13" font-weight="bold">97 / 100</text>

    <!-- Row 3: Over budget -->
    <text x="25" y="125" fill="#64748b" font-family="sans-serif" font-size="11">   3. ASUS TUF A15 (RTX 4060 140W)</text>
    <text x="280" y="125" fill="#dc2626" font-family="monospace" font-size="11">฿44,900</text>
    <text x="390" y="125" fill="#0f172a" font-family="monospace" font-size="11">90</text>
    <text x="480" y="125" fill="#dc2626" font-family="monospace" font-size="11" font-weight="bold">57 (หักงบ)</text>
    <text x="565" y="125" fill="#0f172a" font-family="monospace" font-size="11">100</text>
    <text x="655" y="125" fill="#0f172a" font-family="monospace" font-size="11">95</text>
    <text x="745" y="125" fill="#d97706" font-family="monospace" font-size="13" font-weight="bold">85 / 100</text>
  </g>
</svg>
