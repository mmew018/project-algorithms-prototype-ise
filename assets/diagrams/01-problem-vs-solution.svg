<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="badHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="goodHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" fill="url(#bgGrad)" rx="16"/>
  <rect width="900" height="480" fill="none" stroke="#e2e8f0" stroke-width="2" rx="16"/>

  <!-- Top Banner: User Prompt -->
  <rect x="40" y="24" width="820" height="64" rx="12" fill="#0f172a" filter="url(#cardShadow)"/>
  <circle cx="75" cy="56" r="16" fill="#38bdf8"/>
  <text x="75" y="61" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="900">💬</text>
  <text x="105" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">สิ่งที่ผู้ใช้งานต้องการจริง (User Query):</text>
  <text x="105" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold">"อยากได้โน้ตบุ๊กไว้เขียนโปรแกรม งบไม่เกิน 30,000 บาท"</text>

  <!-- Left Column: Traditional Search (The Problem) -->
  <g transform="translate(40, 106)">
    <!-- Box Container -->
    <rect width="395" height="345" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- Header -->
    <rect width="395" height="48" rx="12" fill="url(#badHeader)"/>
    <rect y="36" width="395" height="12" fill="#dc2626"/>
    <text x="20" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">❌ ระบบค้นหา E-Commerce ทั่วไป (แบบเดิม)</text>

    <!-- Step 1 -->
    <circle cx="35" cy="85" r="14" fill="#fee2e2"/>
    <text x="35" y="90" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
    <text x="60" y="80" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">ค้นหาด้วยคำตรงตัว (Exact Match)</text>
    <text x="60" y="98" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">หาเฉพาะชื่อรุ่นที่มีคำว่า "เขียนโปรแกรม" (หาแทบไม่เจอ)</text>

    <!-- Step 2 -->
    <circle cx="35" cy="145" r="14" fill="#fee2e2"/>
    <text x="35" y="150" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">2</text>
    <text x="60" y="140" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">กรองราคาแบบทวิภาค (Hard Drop)</text>
    <text x="60" y="158" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">รุ่นราคา 30,900 ที่สเปกดีกว่า 2 เท่า ถูกตัดทิ้งทันที</text>

    <!-- Step 3 -->
    <circle cx="35" cy="205" r="14" fill="#fee2e2"/>
    <text x="35" y="210" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">3</text>
    <text x="60" y="200" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">จัดเรียงตามราคาถูกสุด (Lowest Price)</text>
    <text x="60" y="218" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">ดันเครื่องราคา 14,900 (RAM 8GB, 4 คอร์) ขึ้นอันดับ 1</text>

    <!-- Result Banner -->
    <rect x="20" y="250" width="355" height="75" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="35" y="275" fill="#991b1b" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">ผลลัพธ์ที่ผู้ใช้ได้รับ:</text>
    <text x="35" y="296" fill="#b91c1c" font-family="-apple-system, sans-serif" font-size="12">⚠️ ได้เครื่องสเปกต่ำที่เขียนโปรแกรมจริงไม่ได้</text>
    <text x="35" y="314" fill="#7f1d1d" font-family="-apple-system, sans-serif" font-size="11">และไม่มีคำอธิบายว่าทำไมถึงแนะนำ</text>
  </g>

  <!-- Right Column: ISE Solution -->
  <g transform="translate(465, 106)">
    <!-- Box Container -->
    <rect width="395" height="345" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- Header -->
    <rect width="395" height="48" rx="12" fill="url(#goodHeader)"/>
    <rect y="36" width="395" height="12" fill="#0284c7"/>
    <text x="20" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">✨ ระบบ ISE (Intelligent Search Engine)</text>

    <!-- Step 1 -->
    <circle cx="35" cy="85" r="14" fill="#dbeafe"/>
    <text x="35" y="90" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
    <text x="60" y="80" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">สกัดเจตนา (Rule-Based Intent)</text>
    <text x="60" y="98" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11">เข้าใจว่า "เขียนโค้ด" = ต้องการ RAM 16GB + CPU แรง</text>

    <!-- Step 2 -->
    <circle cx="35" cy="145" r="14" fill="#dbeafe"/>
    <text x="35" y="150" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="12" font-weight="bold">2</text>
    <text x="60" y="140" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">คัดกรองแบบ Soft Window (+15%)</text>
    <text x="60" y="158" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11">ไม่ตัดเครื่องทิ้งทันที แต่นำมาคิดคะแนนตามความคุ้มค่า</text>

    <!-- Step 3 -->
    <circle cx="35" cy="205" r="14" fill="#dbeafe"/>
    <text x="35" y="210" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="12" font-weight="bold">3</text>
    <text x="60" y="200" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">จัดอันดับ 4 มิติ (Multi-Criteria Ranking)</text>
    <text x="60" y="218" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11">ชั่งน้ำหนัก: ตรงคำค้น 30% | งบ 25% | สเปก 25% | การใช้ 20%</text>

    <!-- Result Banner -->
    <rect x="20" y="250" width="355" height="75" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="35" y="275" fill="#065f46" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">ผลลัพธ์ที่ผู้ใช้ได้รับ:</text>
    <text x="35" y="296" fill="#047857" font-family="-apple-system, sans-serif" font-size="12">🏆 อันดับ 1: โน้ตบุ๊ก i5 12-Core, RAM 16GB (฿28,900)</text>
    <text x="35" y="314" fill="#064e3b" font-family="-apple-system, sans-serif" font-size="11">💡 มีคำอธิบายภาษาไทยบอกชัดเจนว่าทำไมเครื่องนี้จึงเหมาะที่สุด</text>
  </g>
</svg>
