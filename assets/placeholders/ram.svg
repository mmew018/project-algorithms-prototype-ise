<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ramHeatsink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="rgbDiffuser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="8"/>
  <g transform="translate(60, 85)">
    <!-- Top RGB Lightbar -->
    <rect x="15" y="0" width="250" height="14" rx="4" fill="url(#rgbDiffuser)"/>
    <!-- Metal Heatsink Body -->
    <path d="M 10 12 L 270 12 L 270 88 L 10 88 Z" fill="url(#ramHeatsink)" stroke="#475569" stroke-width="1.5"/>
    <!-- Heat fins / geometric accents -->
    <line x1="40" y1="20" x2="60" y2="75" stroke="#475569" stroke-width="2"/>
    <line x1="65" y1="20" x2="85" y2="75" stroke="#475569" stroke-width="2"/>
    <line x1="195" y1="20" x2="215" y2="75" stroke="#475569" stroke-width="2"/>
    <line x1="220" y1="20" x2="240" y2="75" stroke="#475569" stroke-width="2"/>
    <!-- Brand badge -->
    <rect x="100" y="32" width="80" height="30" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <!-- PCB bottom edge with gold pins -->
    <rect x="12" y="88" width="256" height="18" fill="#064e3b"/>
    <rect x="20" y="94" width="115" height="12" fill="#eab308"/>
    <!-- Notch -->
    <rect x="136" y="94" width="8" height="14" fill="#064e3b"/>
    <rect x="145" y="94" width="115" height="12" fill="#eab308"/>
    <!-- Shadow -->
    <ellipse cx="140" cy="120" rx="130" ry="6" fill="#0f172a" opacity="0.12"/>
  </g>
</svg>
