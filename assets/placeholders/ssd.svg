<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ssdHeatsink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="8"/>
  <g transform="translate(65, 100)">
    <!-- M.2 PCB Board -->
    <rect x="0" y="0" width="270" height="75" rx="3" fill="#022c22" stroke="#065f46" stroke-width="1.5"/>
    <!-- M.2 Standoff Semicircle Cutout -->
    <path d="M 0 30 A 8 8 0 0 1 0 45 Z" fill="#f8fafc"/>
    <!-- Graphene Heatsink / Label Cover -->
    <rect x="18" y="5" width="220" height="65" rx="2" fill="url(#ssdHeatsink)" stroke="#334155" stroke-width="1"/>
    <!-- Gold M.2 Pins / Keying Notch -->
    <rect x="250" y="8" width="18" height="22" fill="#eab308"/>
    <rect x="250" y="32" width="18" height="6" fill="#022c22"/> <!-- M Key Notch -->
    <rect x="250" y="40" width="18" height="26" fill="#eab308"/>
    <!-- Tech text on heatsink -->
    <!-- Capacity badge -->
    <rect x="185" y="16" width="45" height="42" rx="3" fill="#0284c7"/>
    <!-- Shadow -->
    <ellipse cx="135" cy="90" rx="125" ry="5" fill="#0f172a" opacity="0.12"/>
  </g>
</svg>
