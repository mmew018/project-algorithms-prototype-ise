<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ihsMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="8"/>
  <g transform="translate(120, 50)">
    <!-- Substrate / PCB -->
    <rect x="0" y="0" width="160" height="160" rx="6" fill="url(#pcbGreen)" stroke="#047857" stroke-width="2"/>
    <!-- Alignment Notch -->
    <polygon points="5,0 0,5 0,0" fill="#f59e0b"/>
    <!-- Gold Contacts Preview -->
    <rect x="15" y="15" width="130" height="130" rx="3" fill="#047857" opacity="0.3"/>
    <!-- Heat Spreader (IHS) -->
    <rect x="22" y="22" width="116" height="116" rx="4" fill="url(#ihsMetal)" stroke="#64748b" stroke-width="1.5"/>
    <!-- IHS Wings / Retention cutouts -->
    <rect x="18" y="55" width="4" height="50" rx="1" fill="#475569"/>
    <rect x="138" y="55" width="4" height="50" rx="1" fill="#475569"/>
    <!-- Laser Etching Text -->
    <text x="80" y="65" text-anchor="middle" fill="#334155" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">PROCESSOR</text>
    <text x="80" y="82" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10" font-weight="600">AI / MULTI-CORE</text>
    <text x="80" y="100" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">LGA / AM5 COMPATIBLE</text>
    <rect x="50" y="112" width="60" height="8" rx="2" fill="#475569" opacity="0.4"/>
    <!-- Shadow -->
    <ellipse cx="80" cy="175" rx="70" ry="6" fill="#0f172a" opacity="0.12"/>
  </g>
  <text x="200" y="265" text-anchor="middle" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CPU / PROCESSOR</text>
</svg>
