<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="8"/>
  <g transform="translate(60, 70)">
    <!-- Keyboard Base -->
    <rect x="0" y="20" width="200" height="90" rx="6" fill="url(#kbBody)" stroke="#334155" stroke-width="2"/>
    <!-- Keys Grid Representation -->
    <g fill="#334155" stroke="#1e293b" stroke-width="0.5">
      <!-- Function Row -->
      <rect x="8" y="26" width="10" height="8" rx="1"/>
      <rect x="22" y="26" width="10" height="8" rx="1"/>
      <rect x="36" y="26" width="10" height="8" rx="1"/>
      <rect x="50" y="26" width="10" height="8" rx="1"/>
      <rect x="70" y="26" width="10" height="8" rx="1"/>
      <rect x="84" y="26" width="10" height="8" rx="1"/>
      <rect x="98" y="26" width="10" height="8" rx="1"/>
      <rect x="112" y="26" width="10" height="8" rx="1"/>
      <!-- Number Row -->
      <rect x="8" y="38" width="10" height="10" rx="1.5"/>
      <rect x="22" y="38" width="10" height="10" rx="1.5"/>
      <rect x="36" y="38" width="10" height="10" rx="1.5"/>
      <rect x="50" y="38" width="10" height="10" rx="1.5"/>
      <rect x="64" y="38" width="10" height="10" rx="1.5"/>
      <rect x="78" y="38" width="10" height="10" rx="1.5"/>
      <rect x="92" y="38" width="10" height="10" rx="1.5"/>
      <rect x="106" y="38" width="10" height="10" rx="1.5"/>
      <rect x="120" y="38" width="10" height="10" rx="1.5"/>
      <!-- Spacebar Row -->
      <rect x="8" y="90" width="16" height="12" rx="1.5" fill="#475569"/>
      <rect x="40" y="90" width="85" height="12" rx="1.5" fill="#0284c7"/>
      <rect x="135" y="90" width="16" height="12" rx="1.5" fill="#475569"/>
    </g>
    <!-- Rotary Knob on Top Right -->
    <circle cx="180" cy="35" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="180" cy="35" r="3" fill="#0f172a"/>
    <!-- Mouse to the Right -->
    <rect x="220" y="25" width="55" height="85" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Mouse Scroll Wheel -->
    <rect x="244" y="33" width="7" height="18" rx="3" fill="#38bdf8"/>
    <!-- Mouse Split Line -->
    <line x1="247" y1="51" x2="247" y2="70" stroke="#475569" stroke-width="1"/>
    <!-- Shadow -->
    <ellipse cx="140" cy="122" rx="130" ry="6" fill="#0f172a" opacity="0.12"/>
  </g>
  <text x="200" y="265" text-anchor="middle" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">MECHANICAL KEYBOARD / MOUSE</text>
</svg>
